[tool.poetry]
name = "udemy-enroller"
version = "4.1.4"
description = ""
homepage = "https://github.com/aapatre/Automatic-Udemy-Course-Enroller-GET-PAID-UDEMY-COURSES-for-FREE"
authors = ["aapatre <udemyenroller@gmail.com>", "fakeid <udemyenroller@gmail.com>", "cullzie <udemyenroller@gmail.com>"]
readme = "README.md"
keywords = ["udemy", "education", "enroll"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.poetry.dependencies]
python = "^3.10"
# REST based dependencies
beautifulsoup4 = "4.14.3"
"ruamel.yaml" = "0.17.32"
cloudscraper = "1.2.71"
requests = "2.33.1"
aiohttp = {extras = ["speedups"], version = "3.13.5"}
price-parser = "0.5.1"
# UI based dependencies
selenium = "4.43.0"
webdriver-manager = "3.8.6"

[tool.poetry.dev-dependencies]
black = "^25.0"
isort = "^6.0"
pytest = "^8.0"
pytest-cov = "^6.0"
pytest-asyncio = "^0.25.0"
bumpver = "^2025.0"
flake8 = "^7.0"
flake8-bugbear = "^25.0"
flake8-docstrings = "^1.7.0"
flake8-isort = "^6.0"

[tool.isort]
profile = "black"

[tool.bumpver]
current_version = "v4.1.4"
version_pattern = "vMAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    '^version = "{pep440_version}"',
]
"setup.py" = [
    'version="{pep440_version}"',
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
udemy_enroller = "udemy_enroller.cli:main"

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report xml --cov-report term"
testpaths = ["tests"]

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = [
    "tests/*",
    "setup.py",
    "requirements.py",
]
